version: '3.9'

services:
  php-apache:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: php-apache-dev
    ports:
      - "8081:80"
    depends_on:
      - db-dev
    restart: always
    volumes:
      - ./:/var/www
    environment:
      DB_HOST: db-dev
      DB_NAME: mon_site_dev
      DB_USER: user_dev
      DB_PASSWORD: pass_dev
    networks:
      - monreseau-dev

  db-dev:
    image: mariadb:10.5
    container_name: mariadb-dev
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mon_site_dev
      MYSQL_USER: user_dev
      MYSQL_PASSWORD: pass_dev
    volumes:
      - mariadb_data_dev:/var/lib/mysql
    networks:
      - monreseau-dev

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin-dev
    restart: always
    ports:
      - "8082:80"
    environment:
      - PMA_HOST=db-dev
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      - UPLOAD_LIMIT=32M
    depends_on:
      - db-dev
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - monreseau-dev

volumes:
  mariadb_data_dev:

networks:
  monreseau-dev:
